# Publica una actualización OTA (EAS Update, canal production) en cada push a main.
#
# Requiere un secreto EXPO_TOKEN en el repo (Settings → Secrets and variables →
# Actions), creado en https://expo.dev/settings/access-tokens. Con esto el ciclo es:
# fusionar un PR a main (vale desde el móvil) → tests → update publicada → la app
# la descarga al reabrirse dos veces.
#
# OJO: esto cubre cambios de JavaScript. Un cambio nativo (dependencias con código
# nativo, app.config.ts, iconos) sigue necesitando `eas build` + TestFlight.
name: EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      # Nadie mira esta publicación en directo: si algo está roto, mejor que pare aquí.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest

      - name: Publicar EAS Update
        run: eas update --channel production --message "$(git log -1 --pretty=%s)" --non-interactive
